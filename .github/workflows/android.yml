name: Android 16 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.estebvac.urdudeutsch'" apk-badging.txt
          grep -q "sdkVersion:'34'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: UrduMitDeutsch-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select available Pixel profile
        id: avd-profile
        shell: bash
        run: |
          if avdmanager list device | grep -q 'pixel_9_pro'; then
            echo "profile=pixel_9_pro" >> "$GITHUB_OUTPUT"
          elif avdmanager list device | grep -q 'pixel_7_pro'; then
            echo "profile=pixel_7_pro" >> "$GITHUB_OUTPUT"
          else
            echo "profile=pixel_2" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ steps.avd-profile.outputs.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.estebvac.urdudeutsch
            adb logcat -c
            adb shell am start -W -n com.estebvac.urdudeutsch/.MainActivity | tee launch-result.txt
            grep -q "Status: ok" launch-result.txt
            sleep 5
            adb shell pidof com.estebvac.urdudeutsch | tee app-pid.txt
            test -s app-pid.txt
            adb shell dumpsys activity activities > activity-state.txt
            grep -q "com.estebvac.urdudeutsch/.MainActivity" activity-state.txt
            adb exec-out screencap -p > android16-launch.png
            adb logcat -d -v threadtime > android16-logcat.txt
            ! grep -A 30 -B 5 -E "FATAL EXCEPTION|Process: com.estebvac.urdudeutsch" android16-logcat.txt | grep -q "com.estebvac.urdudeutsch"

      - name: Upload Android 16 smoke-test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: UrduMitDeutsch-Android16-smoke-test
          path: |
            android16-launch.png
            launch-result.txt
            app-pid.txt
            activity-state.txt
            android16-logcat.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk UrduMitDeutsch-v0.2.0.apk
          sha256sum UrduMitDeutsch-v0.2.0.apk > UrduMitDeutsch-v0.2.0.apk.sha256
          test -s android16-launch.png

      - name: Publish tested GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.2.0
          ASSETS=(
            UrduMitDeutsch-v0.2.0.apk
            UrduMitDeutsch-v0.2.0.apk.sha256
            android16-launch.png
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Urdu mit Deutsch v0.2.0" \
              --notes "Offline Urdu A0 learning app with German explanations. Built with API 36, verified for minSdk 34 and targetSdk 36, and installed and cold-launched successfully on an Android 16 Pixel emulator." \
              --latest
          fi
