name: Bootstrap Android 16 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4

      - name: Expand Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -o UrduMitDeutsch-source-v0.2.1-github-ready.zip -d .
          rm UrduMitDeutsch-source-v0.2.1-github-ready.zip

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand Android project source"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and build APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select Pixel hardware profile
        id: avd-profile
        shell: bash
        run: |
          if avdmanager list device | grep -q 'pixel_9_pro'; then
            echo "profile=pixel_9_pro" >> "$GITHUB_OUTPUT"
          else
            echo "profile=pixel_7_pro" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ steps.avd-profile.outputs.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            PACKAGE=com.estebvac.urdudeutsch
            ACTIVITY=$PACKAGE/.MainActivity
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb shell am force-stop "$PACKAGE"
            adb logcat -c
            adb shell am start -W -n "$ACTIVITY" | tee launch-result.txt
            grep -q "Status: ok" launch-result.txt
            sleep 4
            adb shell pidof "$PACKAGE" | tee app-pid.txt
            test -s app-pid.txt
            adb shell dumpsys activity activities > activity-state.txt
            grep -q "$PACKAGE/.MainActivity" activity-state.txt
            adb exec-out screencap -p > android16-launch.png
            adb logcat -d -v threadtime > android16-logcat.txt
            if grep -A 30 -B 5 -E "FATAL EXCEPTION|Process: $PACKAGE" android16-logcat.txt | grep -q "$PACKAGE"; then
              echo "Application crash detected"
              exit 1
            fi

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: UrduMitDeutsch-Android16-tested
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            android16-launch.png
            launch-result.txt
            activity-state.txt
            android16-logcat.txt
          if-no-files-found: error
          retention-days: 30
